name: Java CI with Maven

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Checkstyle
      run: mvn -B checkstyle:check -Dcheckstyle.config.location=checkstyle.xml

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4

    - name: Phase Label
      id: phase
      env:
        EVENT: ${{ github.event_name }}
        LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        if [ "$EVENT" != "pull_request" ]; then
          echo "value=dev-push" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        mapfile -t phases < <(echo "$LABELS" | jq -r '.[] | select(. == "phase:tests" or . == "phase:fix")')

        if [ "${#phases[@]}" -ne 1 ]; then
          echo "::error title=Invalid phase labels::PR must have exactly one of 'phase:tests' or 'phase:fix' (found ${#phases[@]}: ${phases[*]:-none})."
          exit 1
        fi

        echo "value=${phases[0]}" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Run tests (failures tolerated)
      if: steps.phase.outputs.value != 'phase:fix'
      run: >
        mvn -B -Dmaven.test.failure.ignore=true
        org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent test

    - name: Verify test reports exist
      if: steps.phase.outputs.value != 'phase:fix'
      run: |
        if ! find . -path '*/target/surefire-reports/*.xml' | grep -q .; then
          echo "::error title=Suite did not run::No surefire reports were produced."
          exit 1
        fi

    - name: Run tests (must pass)
      if: steps.phase.outputs.value == 'phase:fix'
      run: mvn -B org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent test

    # Informational from here on; never blocks merging
    - name: Generate JaCoCo report
      if: always() && steps.phase.outcome == 'success'
      continue-on-error: true
      run: mvn -B org.jacoco:jacoco-maven-plugin:0.8.12:report

    - name: Publish JUnit results (failure list comment)
      if: always() && steps.phase.outcome == 'success'
      continue-on-error: true
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: '**/target/surefire-reports/*.xml'
        check_name: JUnit results
        comment_mode: ${{ github.event_name == 'pull_request' && 'always' || 'off' }}
        list_tests: failed
        fail_on: nothing

    - name: Publish JaCoCo coverage comment
      if: always() && steps.phase.outcome == 'success' && github.event_name == 'pull_request'
      continue-on-error: true
      uses: madrapps/jacoco-report@v1.7.1
      with:
        paths: ${{ github.workspace }}/**/target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        title: JaCoCo coverage
        update-comment: true