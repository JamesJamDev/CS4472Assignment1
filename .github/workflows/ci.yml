# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B checkstyle:check -Dcheckstyle.configLocation=checkstyle.xml
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Phase Label
      id: phase
      env:
        EVENT: ${{ github.event_name }}
        LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        if [ "$EVENT" != "pull_request" ]; then
          echo "value=dev-push" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        mapfile -t phases < <(echo "$LABELS" | jq -r '.[] | select(. == "phase:tests" or . == "phase:fix")')

        if [ "${#phases[@]}" -ne 1 ]; then
          echo "::error title=Invalid phase labels::PR must have exactly one of 'phase:tests' or 'phase:fix' (found ${#phases[@]}: ${phases[*]:-none})."
          exit 1
        fi

        echo "value=${phases[0]}" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Run tests (failures tolerated)
      if: steps.phase.outputs.value != 'phase:fix'
      run: mvn -B -Dmaven.test.failure.ignore=true test

    - name: Run tests (must pass)
      if: steps.phase.outputs.value == 'phase:fix'
      run: mvn -B test
  